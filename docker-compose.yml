version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: dental_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dental_clinic
      POSTGRES_USER: dental_user
      POSTGRES_PASSWORD: dental_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dental_user -d dental_clinic']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dental_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://dental_user:dental_pass@db:5432/dental_clinic
      SESSION_SECRET: ${SESSION_SECRET:-please-change-this-secret-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-please-change-this-encryption-key-too}
      YCLOUD_API_KEY: ${YCLOUD_API_KEY:-}
      YCLOUD_BUSINESS_PHONE: ${YCLOUD_BUSINESS_PHONE:-}
      YCLOUD_INBOUND_SECRET: ${YCLOUD_INBOUND_SECRET:-}
      CLINIC_NAME: ${CLINIC_NAME:-Dental Clinic}
      CLINIC_ADDRESS: ${CLINIC_ADDRESS:-Бишкек, ул. Токомбаева 7/5}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-Asia/Bishkek}
      NODE_ENV: production

volumes:
  postgres_data:
